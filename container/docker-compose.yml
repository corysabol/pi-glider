services:
  pi-glider:
    build: .
    image: pi-glider:latest
    stdin_open: true
    tty: true
    environment:
      - PI_CODING_AGENT_DIR=/root/.pi/agent
    volumes:
      # Engagement-local agentDir (config + skills + extensions + sessions) → container agentDir.
      # Seed it first with `pi-glider <dir>` (or `scripts/pi-glider`), or copy the global agentDir
      # into <engagement>/.pi manually.
      - ${ENGAGEMENT_DIR}/.pi:/root/.pi/agent
      # Engagement dir → /engagement (working dir + evidence)
      - ${ENGAGEMENT_DIR}:/engagement
    # Bridge network (default). Host services reachable via host.docker.internal.
    # On macOS, host.docker.internal is resolved automatically. The extra_hosts entry
    # below provides it on Linux. For full --network=host semantics on Linux, replace
    # `extra_hosts` with: network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /engagement
