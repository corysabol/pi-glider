services:
  pi-glider:
    build: .
    image: pi-glider:latest
    stdin_open: true
    tty: true
    environment:
      - PI_CODING_AGENT_DIR=/engagement/.pi
    volumes:
      # Engagement dir → /engagement (working dir + evidence + .pi agentDir). The per-engagement
      # agentDir lives at <engagement>/.pi; seed it first with `pi-glider init <dir>`.
      - ${ENGAGEMENT_DIR}:/engagement
    # Bridge network (default). Host services reachable via host.docker.internal.
    # On macOS, host.docker.internal is resolved automatically. The extra_hosts entry
    # below provides it on Linux. For full --network=host semantics on Linux, replace
    # `extra_hosts` with: network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /engagement
    ports:
      # Caido UI/API (operator web browser) + Caido HTTP(S) proxy.
      # Container-side ports are fixed (5000/8080, see Dockerfile ENV); map host ports via .env.
      - "${CAIDO_UI_PORT:-5000}:5000"
      - "${CAIDO_PROXY_PORT:-8080}:8080"
